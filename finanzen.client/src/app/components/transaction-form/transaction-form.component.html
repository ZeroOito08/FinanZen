<h2>Nova Transação</h2>

<form #transactionForm="ngForm" (ngSubmit)="onSubmit()">

  <div>
    <label for="descricao">Descrição:</label>
    <input type="text" id="descricao" name="descricao" placeholder="Ex: Salário, Aluguel..." [(ngModel)]="model.descricao" required>
  </div>

  <div>
    <label for="valor">Valor (R$):</label>
    <input type="number" id="valor" name="valor" placeholder="150.50" [(ngModel)]="model.valor" required>
  </div>

  <div>
    <label for="data">Data:</label>
    <input type="date" id="data" name="data" [(ngModel)]="model.data" required>
  </div>

  <button type="submit" [disabled]="!transactionForm.form.valid">Salvar Transação</button>

</form>
