<div class="form-wrapper glass-card">
  <div class="form-header">
    <h2 *ngIf="isEditMode">Editar Transação</h2>
    <h2 *ngIf="!isEditMode">Nova Transação</h2>
  </div>

  <form #transactionForm="ngForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <div class="form-group">
        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao" name="descricao" [(ngModel)]="model.descricao" required>
      </div>

      <div class="form-group">
        <label for="valor">Valor (R$):</label>
        <input type="number" id="valor" name="valor" [(ngModel)]="model.valor" required>
      </div>

      <div class="form-group">
        <label for="data">Data:</label>
        <input type="date" id="data" name="data" [(ngModel)]="model.data" required>
      </div>

      <div class="form-group">
        <label for="categoria">Categoria:</label>
        <select id="categoria" name="categoriaId" [(ngModel)]="model.categoriaId" (ngModelChange)="onCategoriaChange($event)" required>
          <option [ngValue]="null" disabled>Selecione uma categoria</option>
          <option *ngFor="let categoria of categorias" [value]="categoria.categoriaID">
            {{ categoria.nome }}
          </option>
        </select>
      </div>
      
      <div class="form-group" *ngIf="isContaMensalSelected">
        <label for="dataVencimento">Data de Vencimento:</label>
        <input type="date" id="dataVencimento" name="dataVencimento" [(ngModel)]="model.dataVencimento">
      </div>

      <div class="form-group">
        <label for="tipoPagamento">Tipo de Pagamento:</label>
        <select id="tipoPagamento" name="tipoPagamento" [(ngModel)]="model.tipoPagamento" required>
          <option value="Dinheiro">Dinheiro</option>
          <option value="Cartao_Debito">Cartão de Débito</option>
          <option value="Cartao_Credito">Cartão de Crédito</option>
          <option value="PIX">PIX</option>
        </select>
      </div>

      <div class="form-group">
        <label for="responsavel">Responsável:</label>
        <select id="responsavel" name="responsavel" [(ngModel)]="model.responsavel" required>
          <option *ngFor="let responsavel of responsaveis" [value]="responsavel">{{ responsavel }}</option>
        </select>
      </div>
    </div>
    
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="!transactionForm.form.valid">
        {{ isEditMode ? 'Atualizar Transação' : 'Salvar Transação' }}
      </button>
    </div>
  </form>
</div>
