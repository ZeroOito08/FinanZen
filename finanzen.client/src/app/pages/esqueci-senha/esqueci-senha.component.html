<h2>Esqueci minha senha</h2>

<form (submit)="solicitarReset(); $event.preventDefault()">
  <label for="email">E-mail:</label>
  <input
    type="email"
    id="email"
    name="email"
    [(ngModel)]="email"
    required
  />

  <button type="submit">Enviar link de redefinição</button>
</form>

<p *ngIf="mensagem">{{ mensagem }}</p>
