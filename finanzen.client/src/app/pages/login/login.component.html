<div class="login-container">
  <h2>Login</h2>
  <p>Acesse sua conta para gerenciar suas finanças.</p>

  <form #loginForm="ngForm" (ngSubmit)="onLogin()">
    <div class="form-group">
      <label for="email">Email:</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="loginModel.email" 
        placeholder="seuemail@exemplo.com"
        required 
        email>
    </div>
  
    <div class="form-group">
      <label for="password">Senha:</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        [(ngModel)]="loginModel.senha" 
        placeholder="Sua senha"
        required>
    </div>
  
    <button type="submit" [disabled]="!loginForm.form.valid">Entrar</button>
  </form>

  <div class="extra-links">
    <a routerLink="/register">Primeiro acesso? Cadastre-se</a>
    <span>|</span>
    <a href="#">Esqueceu a senha?</a>
  </div>
</div>
