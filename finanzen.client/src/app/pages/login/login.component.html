<div class="form-wrapper glass-card">

  <div class="form-header">
    <h2>Login</h2>
    <p>Acesse sua conta para gerenciar suas finanças.</p>
  </div>

  <form #loginForm="ngForm" (ngSubmit)="onLogin()">
    <div class="form-group">
      <label for="email">Email:</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="loginModel.email" 
        required 
        email>
    </div>

    <div class="form-group">
      <label for="password">Senha:</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        [(ngModel)]="loginModel.senha" 
        required>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="!loginForm.form.valid">Entrar</button>
    </div>
  </form>

  <div class="extra-links">
    <a routerLink="/register">Primeiro acesso? Cadastre-se</a>
    <a routerLink="/forgot-password">Esqueceu a senha?</a> </div>
</div>
