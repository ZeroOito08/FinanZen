<div class="register-container">
  <h2>Crie sua Conta</h2>
  <p>É rápido e fácil.</p>

  <form #registerForm="ngForm" (ngSubmit)="onRegister()">
    <div class="form-group">
      <label for="nome">Nome Completo:</label>
      <input type="text" id="nome" name="nome" [(ngModel)]="registerModel.nome" required>
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" [(ngModel)]="registerModel.email" required email>
    </div>

    <div class="form-group">
      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" [(ngModel)]="registerModel.senha" required>
    </div>

    <button type="submit" [disabled]="!registerForm.form.valid">Cadastrar</button>
  </form>

  <div class="extra-links">
    <a routerLink="/login">Já tem uma conta? Faça o login</a>
  </div>
</div>
